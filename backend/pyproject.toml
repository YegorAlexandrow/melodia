[project]
name = "melodia-backend"
version = "0.1.0"
description = "Бэкенд каталога винила «Мелодия» (FastAPI + MongoDB + Beanie)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Beanie 2.x использует нативный async-драйвер PyMongo (AsyncMongoClient),
    # Motor не требуется.
    "beanie>=2.1",
    "pymongo>=4.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.api", "app.models"]

[tool.ruff]
line-length = 100
target-version = "py311"
