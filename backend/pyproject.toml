[project]
name = "melodia-backend"
version = "0.1.0"
description = "Бэкенд каталога винила «Мелодия» (FastAPI + MongoDB + Beanie)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Beanie 2.x использует нативный async-драйвер PyMongo (AsyncMongoClient),
    # Motor не требуется.
    "beanie>=2.1",
    "pymongo>=4.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # HTTP-клиент для Discogs
    "httpx>=0.27",
    # Автозаполнение тех-полей аудио (этап 5)
    "mutagen>=1.47",
    # Загрузка файлов (multipart) для аудио
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.api", "app.models"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
